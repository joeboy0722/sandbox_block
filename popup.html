<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --accent: #3b82f6;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: var(--bg-main);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 頁籤 Tab 樣式 */
    .tabs-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569; transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .quick-launch {
      margin-bottom: 16px;
    }
    .input-group {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    .btn-launch {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .stat-card {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 16px;
    }
    .stat-number {
      font-size: 20px;
      font-weight: 800;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .domain-list, .blacklist-list {
      max-height: 160px;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .domain-item, .blacklist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .domain-item:last-child, .blacklist-item:last-child { border-bottom: none; }
    .badge-choice {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-sandbox { background: var(--primary); color: white; }
    .badge-direct { background: #64748b; color: white; }
    .btn-del {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .current-site-banner {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .selector-code {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f1f5f9;
      word-break: break-all;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🛡️ 沙盒虛擬瀏覽器</div>
  </div>

  <!-- 分頁導覽列 -->
  <div class="tabs-nav">
    <button id="btnTabSettings" class="tab-btn active">🛡️ 總覽設定</button>
    <button id="btnTabBlacklist" class="tab-btn">🚫 網頁黑名單</button>
  </div>

  <!-- 頁籤一：總覽設定 -->
  <div id="viewSettings" class="tab-content active">
    <div class="toggle-row">
      <span class="toggle-label">網頁開啟前全自動攔截詢問</span>
      <label class="switch">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="stat-card">
      已累積防護與封鎖跳轉：<span id="blockCount" class="stat-number">0</span> 次
    </div>

    <div class="quick-launch">
      <div class="section-title">手動輸入網址開啟沙盒</div>
      <div class="input-group">
        <input type="text" id="quickUrl" placeholder="https://example.com" />
        <button id="btnQuickLaunch" class="btn-launch">開啟</button>
      </div>
    </div>

    <div class="section-title">已記憶網域規則</div>
    <div id="domainList" class="domain-list">
      <!-- 動態帶入 -->
    </div>
  </div>

  <!-- 頁籤二：黑名單分頁 -->
  <div id="viewBlacklist" class="tab-content">
    <div class="current-site-banner">
      📍 目前網站：<span id="currentDomainDisplay">載入中...</span>
    </div>
    <div class="section-title">對該網頁已隱藏的元素 (點擊右鍵新增)</div>
    <div id="blacklistContainer" class="blacklist-list">
      <!-- 動態帶入 -->
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
